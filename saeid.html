                                    class="form-control custfield"
                                    id="ddlNationality"

                                        style="color: red; display: none"
                                        >*</span
                                    ></label

                                    function AvoidSpace() {
                                        if (event.keyCode == 32) {
                                            event.returnValue = false;
                                            return false;
                                        }
                                    }
                                </script>

                                <input
                                    class="form-control custfield"
                                    id="txtEmail"

                                    name="txtEmail"
                                    onkeypress="return AvoidSpace();"

                                    type="text"
